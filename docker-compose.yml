services:
  api:
    build:
      context: .
    image: wildfire-risk-mlops:latest
    ports:
      - "8000:7860"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:7860/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
