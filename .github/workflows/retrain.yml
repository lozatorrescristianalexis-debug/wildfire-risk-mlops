name: Retrain and promote model

on:
  workflow_run:
    workflows: ["Refresh real FIRMS data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      data_run_id:
        description: Successful data-update workflow run containing the real-data artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  retrain:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Download the processed dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: real-data-update
          path: fresh-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.data_run_id || github.event.workflow_run.id }}
      - name: Install refreshed real dataset
        run: |
          cp fresh-data/data/processed/real_daily.csv data/processed/real_daily.csv
          cp fresh-data/reports/real_ingestion.json reports/real_ingestion.json
          cp fresh-data/reports/firms_gap_alternative_sources.json reports/firms_gap_alternative_sources.json
          cp fresh-data/web/region_weather.json web/region_weather.json
      - name: Save current model validation score
        run: cp reports/real_metrics.json "$RUNNER_TEMP/baseline_metrics.json"
      - name: Train on refreshed real data
        run: python -m src.wildfire.cli train --region peru --trials 5
      - name: Refresh real holdout examples
        run: python -m scripts.generate_holdout_examples
      - name: Compare temporal validation F1
        id: compare
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          old = json.loads(Path(os.environ["RUNNER_TEMP"], "baseline_metrics.json").read_text())
          new = json.loads(Path("reports/real_metrics.json").read_text())
          old_f1 = old["models"][old["selected_model"]]["validation_f1_at_selected_threshold"]
          new_f1 = new["models"][new["selected_model"]]["validation_f1_at_selected_threshold"]
          promote = old.get("training_region") != new.get("training_region") or new_f1 > old_f1
          print(f"Current temporal validation F1: {old_f1:.6f}")
          print(f"Candidate temporal validation F1: {new_f1:.6f}")
          print(f"Promote candidate: {'yes' if promote else 'no'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"promote={'true' if promote else 'false'}\n")
          PY
      - name: Commit promoted data, model, and metadata
        if: ${{ steps.compare.outputs.promote == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/wildfire_real.joblib reports/real_metrics.json reports/real_ingestion.json reports/firms_gap_alternative_sources.json reports/figures web/real_examples.json web/region_weather.json
          git commit -m "chore: promote improved real wildfire model" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin main
      - name: Keep current model when validation does not improve
        if: ${{ steps.compare.outputs.promote != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/region_weather.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh regional historical weather profiles"
            git push origin main
          fi
