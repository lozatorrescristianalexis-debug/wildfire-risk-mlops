name: Real-data drift monitoring

on:
  workflow_run:
    workflows: ["Refresh real FIRMS data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      data_run_id:
        description: Successful data-update workflow run containing the real-data artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Download the processed dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: real-data-update
          path: fresh-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.data_run_id || github.event.workflow_run.id }}
      - name: Install refreshed real dataset
        run: cp fresh-data/data/processed/real_daily.csv data/processed/real_daily.csv
      - name: Calculate rolling feature and label drift
        run: python -m src.wildfire.monitor --input data/processed/real_daily.csv --output reports/drift_latest.json
      - name: Summarize drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/drift_latest.json").read_text())
          print(f"Reference window: {report['reference_window']}")
          print(f"Recent window: {report['recent_window']}")
          print(f"Positive rate change: {report['label_rate']['absolute_change']:.6f}")
          print(f"Features with PSI >= 0.20: {report['drifted_features']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-drift-report
          path: reports/drift_latest.json
          if-no-files-found: error
          retention-days: 30
