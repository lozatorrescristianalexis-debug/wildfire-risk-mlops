name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-render:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test client
        run: python -m pip install requests==2.32.3
      - name: Wait for Render deploy and smoke-test real prediction
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests

          base_url = os.environ["APP_URL"].rstrip("/")
          session = requests.Session()
          checks = [
              ("health", "GET", "/health", None),
              ("model_info", "GET", "/model-info", None),
              (
                  "predict",
                  "POST",
                  "/predict",
                  json.loads(Path("reports/api_http_evidence.json").read_text())["request"],
              ),
          ]
          evidence = {}
          for name, method, path, payload in checks:
              last_error = None
              for attempt in range(1, 13):
                  try:
                      response = session.request(
                          method,
                          base_url + path,
                          json=payload,
                          timeout=(15, 75),
                      )
                      response.raise_for_status()
                      result = response.json()
                      if name == "health" and result.get("model_loaded") is not True:
                          raise RuntimeError(f"Health check did not load the model: {result}")
                      if name == "model_info" and result.get("data_source") != "firms_open_meteo":
                          raise RuntimeError(f"Unexpected model data source: {result}")
                      if name == "predict" and not 0 <= result["probability"] <= 1:
                          raise RuntimeError(f"Invalid prediction probability: {result}")
                      evidence[name] = {
                          "status_code": response.status_code,
                          "attempt": attempt,
                          "response": result,
                      }
                      print(f"{name}: HTTP {response.status_code} on attempt {attempt}")
                      break
                  except (requests.RequestException, ValueError, KeyError, RuntimeError) as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                      if attempt < 12:
                          print(f"{name}: attempt {attempt} failed; retrying in 10 seconds ({last_error})")
                          time.sleep(10)
              else:
                  raise RuntimeError(
                      f"{name} failed after 12 attempts against {base_url}{path}: {last_error}"
                  )
          print(json.dumps(evidence, indent=2))
          PY
  render-url-configuration:
    if: ${{ vars.APP_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain missing Render URL
        run: |
          echo "::error::Configure the GitHub Actions variable APP_URL with the public Render service URL."
