name: CD

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - README.md
      - requirements.txt
      - .dockerignore
      - src/**
      - web/**
      - models/wildfire_real.joblib
      - reports/real_metrics.json
      - .github/workflows/cd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment token without displaying its value
        id: configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment was not attempted. Configure the GitHub Actions secret HF_TOKEN."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deployment token configured: yes"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.configuration.outputs.configured == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        with:
          python-version: "3.11"
      - name: Install deployment client
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        run: python -m pip install huggingface_hub==0.31.2 requests==2.32.3
      - name: Publish the allow-listed application files
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE"]
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              allow_patterns=[
                  "README.md",
                  "Dockerfile",
                  "requirements.txt",
                  "src/**",
                  "web/**",
                  "models/wildfire_real.joblib",
                  "reports/real_metrics.json",
              ],
              commit_message="Deploy wildfire classifier",
          )
          print(f"Published allow-listed application files to {repo_id}.")
          PY
      - name: Smoke test deployed health endpoint
        if: ${{ steps.configuration.outputs.configured == 'true' }}
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          space_url = "https://" + os.environ["HF_SPACE"].replace("/", "-") + ".hf.space"
          last_error = None
          for _ in range(24):
              try:
                  with urlopen(space_url + "/health", timeout=15) as response:
                      payload = json.loads(response.read())
                      if response.status == 200 and payload.get("model_loaded") is True:
                          print("Deployed /health returned HTTP 200 with model_loaded=true.")
                          break
                      raise RuntimeError(f"Unexpected health response: {payload}")
              except (URLError, TimeoutError) as exc:
                  last_error = exc
                  time.sleep(10)
          else:
              raise RuntimeError(f"Deployed health smoke test failed: {last_error}")
          PY

  deployment-configuration:
    if: ${{ vars.HF_SPACE == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required deployment configuration
        run: |
          echo "::notice::Deployment was not attempted. Configure the GitHub Actions variable HF_SPACE and secret HF_TOKEN as described in README.md."
